apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-deployment
  labels:
    app: price-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: price-service
  template:
    metadata:
      labels:
        app: price-service
    spec:
      containers:
      - name: price-service
        image: gastonacr.azurecr.io/priceservice:v1
        ports:
        - containerPort: 8081
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8081"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /api/health
            port: 8081
          failureThreshold: 30
          periodSeconds: 10
